# AUDIRE — 라이브 자막 아티팩트 학습 설정 (Phase 4 결과).
#
# E30 이 선택한 arm 으로 로지스틱을 전 시드에 적합합니다. 미디어 배포 아티팩트를 덮어쓰지
# 않는 별도 계열이며, 음향 맥락을 포함하지 않으므로 학습과 추론이 같은 정보 제약 아래에
# 있습니다(ADR-0021).
#
# 이 적합 자체에는 홀드아웃 성능 주장을 붙이지 않습니다. 성능 주장은 E30 의 청취자 수준
# 교차검증만 사용합니다.

name: live_model
description: 브라우저 DOM 자막 경로용 라이브 아티팩트 학습 (합성 출처, 사람 효능 근거 아님).

simulation:
  name: live_model_cohort
  seeds: [101, 202, 303, 404, 505]
  n_listeners: 80
  n_calibration_trials: 100
  n_word_trials: 250
  snr_conditions_db: [20.0, 10.0, 5.0, 0.0, -5.0]
  speakers: [male, female]

arms:
  - live_word_context
  - live_word_context_clinical
  - live_word_context_clinical_confusion

models: [logistic]
n_splits: 5
calibration: none
n_bootstrap: 0
contrasts: []
