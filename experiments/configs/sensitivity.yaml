# E11 — 개인 특이성 × 교정 길이 민감도 스윕.
#
# RQ2의 음성 결과가 방법의 성질인지, 아니면 선택된 두 값의 성질인지 결정한다.
# 축 1: dirichlet_concentration — 청취자가 자신의 능력이 예측하는 것을 넘어 얼마나
#        특이한가. 낮을수록 개별 특이성이 크다.
# 축 2: n_calibration_trials — 그 특이성을 얼마나 잘 추정할 수 있는가.
#
# 두 축이 모두 유리할 때에만 혼동 프로파일이 도움이 될 수 있다는 가설을 직접 검정한다.
# 스윕 격자와 시드는 결과를 보기 전에 여기에 고정되어 있다.

name: sensitivity_idiosyncrasy_calibration
description: >-
  개인 특이성(디리클레 집중도)과 교정 길이에 대한 2차원 스윕. 개인화 선택 자막이
  비개인화 단어길이 휴리스틱을 이기기 시작하는 영역의 경계를 찾는다.

base_simulation:
  name: sensitivity_cohort
  seeds: [101, 202, 303]
  n_listeners: 60
  n_calibration_trials: 100
  n_word_trials: 200
  snr_conditions_db: [20.0]
  speakers: [male, female]

# 축 1: 낮을수록 청취자가 더 특이함
dirichlet_concentration: [5.0, 20.0, 80.0]
# 축 2
calibration_lengths: [25, 100, 400]

arms: [word_context_only, clinical, clinical_plus_confusion]
models: [logistic]
n_splits: 5
n_bootstrap: 200
caption_budgets: [0.20]
