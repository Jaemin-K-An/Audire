  git_sha: 0de37010c6df056f51c7230475977408813ea16f
  git_dirty: true
  lock_hash: d8d2ae59c1bdb174
  python: 3.12.9
  platform: Darwin arm64
  seeds:
  - 7
  config:
    name: smoke
    description: Deterministic minimal run used by CI to prove the research path executes.
    simulation:
      name: smoke_cohort
      seeds:
      - 7
      n_listeners: 20
      n_calibration_trials: 40
      n_word_trials: 40
      snr_conditions_db:
      - 20.0
      speakers:
      - male
      - female
      severity:
        evidence: literature
        evidence_source: joo2026_error_rates
        rationale: Group sizes mirror the reference study's design (20 normal / 20 mild / 20 moderate
          / 12 severe, n=72) so that the simulated cohort has a comparable shape. This fixes the *proportions*,
          not any listener's behaviour.
        scheme: korean_study_4group
        weights:
          normal: 20.0
          mild: 20.0
          moderate: 20.0
          severe: 12.0
      audiogram:
        evidence: clinical_convention
        evidence_source: null
        rationale: Age-related hearing loss in older adults characteristically slopes downward toward
          high frequencies. The stratum PTA windows follow the named severity scheme; the slope and noise
          magnitudes are chosen to produce realistic-looking but not evidence-derived audiogram shapes.
        pta_window_db:
          normal:
          - 5.0
          - 19.0
          mild:
          - 20.0
          - 34.0
          moderate:
          - 35.0
          - 49.0
          moderately_severe:
          - 50.0
          - 64.0
          severe:
          - 65.0
          - 85.0
          profound:
          - 86.0
          - 100.0
        slope_db_per_octave_mean: 6.0
        slope_db_per_octave_sd: 3.0
        threshold_noise_db_sd: 4.0
        interaural_asymmetry_db_sd: 5.0
        pta_method: pta4_500_1000_2000_4000
      speech:
        evidence: literature
        evidence_source: joo2026_error_rates
        rationale: Monosyllable correct-response rates per hearing group are anchored to the reference
          study's reported total error rates (normal 18.3 %, mild 27.8 %, moderate 48.4 %, severe 80.4
          % errors at MCL over 726 monosyllables), i.e. correct rates of 81.7 / 72.2 / 51.6 / 19.6 %.
          SRT-PTA agreement is a clinical convention rather than a finding. The within-group spread is
          an assumption.
        accuracy_by_stratum:
          normal: 0.817
          mild: 0.722
          moderate: 0.516
          moderately_severe: 0.4
          severe: 0.196
          profound: 0.1
        ability_sd_logit: 0.55
        srt_minus_pta_mean_db: 0.0
        srt_minus_pta_sd_db: 5.0
        wrs_n_words: 50
        pbmax_increment_mean: 6.0
        pbmax_increment_sd: 4.0
        p_has_pi_function: 0.5
        p_has_loudness: 0.6
        mcl_above_pta_db: 30.0
        mcl_sd_db: 6.0
        dynamic_range_db_mean: 30.0
        dynamic_range_db_sd: 8.0
      confusion:
        evidence: literature
        evidence_source: ma2026_similarity
        rationale: The reference study reports that perceptual distance between phonemes shrinks as hearing
          loss increases (onset 5.43 -> 3.05, nucleus 5.51 -> 3.53, coda 5.78 -> 3.66 from normal to severe)
          and that confusions concentrate within phonetic classes. This motivates (a) within-class concentration
          via a similarity kernel and (b) a concentration parameter that rises with severity. The specific
          beta values and the Dirichlet concentration are assumptions.
        position_difficulty:
          onset: 1.15
          nucleus: 0.7
          coda: 1.15
        similarity_beta_normal: 1.5
        similarity_beta_severe: 4.0
        dirichlet_concentration: 40.0
        no_response_share: 0.05
      trials:
        evidence: assumption
        evidence_source: null
        rationale: 'Lexical repair, word-length effects and SNR effects are declared assumptions with
          no numeric source. Their purpose is twofold. First, they make the generative process differ
          structurally from the phoneme-independence scoring model, so that comparing the two is informative
          rather than circular. Second, they bridge the gap between the context-free monosyllable task
          the literature measures and the connected speech AUDIRE captions: a listener who misses one
          segment of a word in running speech often still identifies it. The resulting word-level mishearing
          base rate is therefore a CONFIGURED property of the simulation, is reported in every cohort
          summary, and is swept explicitly in the sensitivity study rather than treated as a fixed fact.'
        lexical_repair_base: 0.55
        lexical_repair_per_extra_syllable: 0.12
        lexical_repair_max: 0.9
        lexical_repair_multi_error: 0.15
        snr_logit_per_db: 0.06
        reference_snr_db: 20.0
        speaker_effects:
          male: -0.1
          female: 0.1
          synthetic_tts: 0.0
      words:
        evidence: assumption
        evidence_source: null
        rationale: The synthetic word generator samples syllable counts from a distribution that resembles
          Korean eojeol length in running text but is not measured from a corpus. Use `source='zeroth'`
          to draw words from the CC BY-licensed Zeroth-Korean transcripts instead when a real distribution
          matters.
        source: synthetic
        syllable_count_weights:
          '1': 0.2
          '2': 0.45
          '3': 0.25
          '4': 0.1
        vocabulary_size: 400
    arms:
    - word_context_only
    - clinical
    - clinical_plus_confusion
    models:
    - logistic
    n_splits: 4
    calibration: none
    n_bootstrap: 20
    ece_bins: 10
    decision_threshold: 0.5
    caption_budgets:
    - 0.2
    threshold_targets:
    - 0.2
    contrasts:
    - - clinical_plus_confusion
      - clinical
    contrast_metrics:
    - pr_auc
  data_manifests: {}
  artifacts:
