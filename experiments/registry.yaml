  - experiments/artifacts/smoke-20260816T051812Z-0de3701/summary.json
  metrics:
    best_arm: clinical_plus_confusion
    best_pr_auc_mean: 0.6641663426213781
    n_seeds: 1
    caveat: Synthetic data. These are engineering and design-sensitivity results, not clinical evidence
