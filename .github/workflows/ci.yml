name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  AUDIRE_LOG_FORMAT: console

jobs:
  quality:
    name: lint · types · tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,data,dev]"

      - name: Format and lint
        run: |
          ruff format --check .
          ruff check .

      - name: Type check (strict)
        run: mypy

      - name: Tests with branch coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml -m "not asr and not e2e and not data"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  # LightGBM 은 선택적 연구 모델 extra 입니다. 기본 잡은 그것 없이 돌아 배포 경로가
  # 가볍게 유지되는지 확인하고, 이 잡이 extra 를 설치해 랭킹 모델의 불변식을 실제로
  # 검증합니다. 마커로 건너뛰기만 하면 그 불변식이 아무 데서도 검증되지 않습니다.
  research-models:
    name: optional research models (LightGBM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,data,dev,research-models]"
      - name: Ranking-model invariants actually run
        run: pytest -m "research_models" --no-cov

  # The integrity gates run as their own job, deliberately.
  #
  # They used to be the last two steps of `quality`, behind lint, mypy and the full test
  # suite. A step failure cancels the rest of the job, so the checks that answer "did we
  # commit participant data?" and "does every source declare its licence?" were skipped
  # exactly when the branch was in the worst shape. These are the highest-consequence
  # checks in the repository and they must report independently, on every run.
  integrity:
    name: privacy · provenance gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[data]"

      - name: Privacy gate — no participant data or raw corpora tracked
        # `always()` so a provenance failure below still leaves this result visible.
        if: always()
        run: python scripts/check_repo_hygiene.py

      - name: Provenance gate — every source declares licence and use policy
        if: always()
        run: python scripts/fetch_data.py list

  extension:
    name: browser extension invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # No `npm install`: the extension has zero dependencies and runs on the Node
      # built-in test runner. Nothing to install means nothing to keep pinned, and no
      # build step between what is tested and what ships.
      - name: Extension tests (permissions, token handling, cue ordering)
        working-directory: extensions/audire-live
        run: npm test

  security:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      # Audit the pinned lockfile, not the installed environment. `--strict` on the
      # environment fails on the local editable `audire` package ("not found on PyPI"),
      # which is a configuration problem, not a finding — and the `|| true` that used to
      # paper over it also swallowed real vulnerabilities, so this job reported green
      # unconditionally. Auditing the lockfile lets the gate actually gate.
      - name: Audit pinned dependencies
        run: pip-audit --strict -r requirements.lock

  smoke:
    name: CPU end-to-end smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,data,dev]"
      - name: Deterministic pipeline smoke test (no model download)
        run: pytest tests/integration -q -m "not asr"
